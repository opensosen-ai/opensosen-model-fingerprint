<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
    <title>OpenSosen 模型指纹</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="renderer.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-content">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div><p>OpenSosen Model Fingerprint</p><h1>OpenSosen 模型指纹</h1></div>
        </div>
        <div id="connection-badge" class="badge" data-tone="pending" role="status">正在连接 Codex</div>
      </div>
    </header>

    <main>
      <section class="panel setup" aria-labelledby="setup-title">
        <div class="section-head">
          <h2 id="setup-title">检测设置</h2>
          <button id="refresh" class="secondary" type="button">刷新连接</button>
        </div>
        <div class="codex-selector" aria-label="Codex 程序设置">
          <div class="codex-selection-head">
            <strong>Codex 程序</strong>
            <span id="codex-mode" class="secondary-text">自动查找（PATH）</span>
          </div>
          <p id="codex-path" class="mono codex-path" aria-live="polite">正在查找…</p>
          <div class="codex-actions">
            <button id="choose-codex" class="secondary" type="button">选择 Codex…</button>
            <button id="use-path-codex" class="secondary" type="button" disabled>恢复 PATH 自动查找</button>
          </div>
          <p class="fine-print">默认从 PATH 查找；手动选择会保存，切换后自动刷新连接。</p>
        </div>
        <dl class="connection-details">
          <div><dt>Codex 登录方式</dt><dd id="account">读取中…</dd></div>
          <div><dt>检测通道</dt><dd id="route">读取中…</dd></div>
        </dl>
        <p id="route-detail" class="fine-print" hidden></p>
        <p id="connection-message" class="callout" role="status" hidden></p>
        <form id="detect-form">
          <label for="model">目标模型</label>
          <div class="controls">
            <select id="model" aria-describedby="sample-note" disabled><option>正在读取列表…</option></select>
            <button id="start" class="primary" type="submit" disabled>开始检测</button>
            <button id="cancel" class="secondary" type="button" hidden>取消</button>
          </div>
          <p id="sample-note" class="fine-print">每次检测提交三条独立的数字挑战，使用所选通道的额度。</p>
        </form>
      </section>

      <section class="panel progress" aria-labelledby="progress-title">
        <div class="section-head">
          <h2 id="progress-title">采样进度</h2>
          <span id="progress-count" class="mono secondary-text" role="status">0 / 3 已收到</span>
        </div>
        <ol id="samples" class="samples"></ol>
      </section>

      <section class="panel result" aria-labelledby="result-title">
        <div class="section-head">
          <h2 id="result-title">结果与证据</h2>
          <button id="export" class="secondary" type="button" disabled>导出 JSON</button>
        </div>
        <div id="result-body" aria-live="polite"><p class="empty">检测完成后在这里查看相似候选和原始回复。</p></div>
        <div id="evidence"></div>
        <p id="export-message" class="fine-print" role="status" hidden></p>
      </section>

      <footer class="reference">
        <div><strong>参考库</strong><span id="bank-status" aria-live="polite">正在检查…</span></div>
        <button id="refresh-bank" class="secondary" type="button" disabled>检查更新</button>
      </footer>
    </main>
  </body>
</html>
